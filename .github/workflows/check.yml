name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the Grok Build CLI
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
      - name: Check the library (marketplace JSON, catalog, every entry installs at its pin)
        run: bash scripts/check.sh
      # A pull request can loosen its own check.sh, so the base branch's copy
      # runs on the same tree too. A pull request that moves a file the base
      # copy names lands the check.sh change first, in its own pull request.
      - name: Check the library, base branch copy
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=1 origin "$BASE_REF"
          if ! git cat-file -e FETCH_HEAD:scripts/check.sh 2>/dev/null; then
            echo "The base branch has no scripts/check.sh yet; this pull request adds it."
            exit 0
          fi
          git show FETCH_HEAD:scripts/check.sh > scripts/check.sh
          bash scripts/check.sh
