name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The marketplace file is valid JSON
        run: python3 -m json.tool .grok-plugin/marketplace.json > /dev/null
      - name: Cards, catalog and marketplace agree
        run: python3 scripts/check_catalog.py

  install:
    runs-on: ubuntu-latest
    needs: catalog
    steps:
      - uses: actions/checkout@v7
      - name: Install the Grok Build CLI
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
      - name: Install every entry at its pin in a clean Grok home
        run: scripts/verify.sh
